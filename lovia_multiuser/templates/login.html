<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · lovia</title>
  <style>
    :root { --bg: #f7f8fa; --surface: #fff; --border: #e4e7ec; --ink: #16181d; --muted: #6b7280; --accent: #2d8a6e; --danger: #c2483a; --danger-soft: #fbeeec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d0e12; --surface: #16181d; --border: #2a2e37; --ink: #e8eaee; --muted: #9aa1ad; --accent: #4fb393; --danger: #e57366; --danger-soft: #33201d; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--ink);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
    h1 { font-size: 20px; margin: 0 0 20px; }
    label { display: block; margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    input {
      display: block; width: 100%; margin-top: 6px; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit;
    }
    button { width: 100%; margin-top: 6px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .error { background: var(--danger-soft); color: var(--danger); padding: 8px 12px; border-radius: 8px; margin: 0 0 16px; }
    .note { color: var(--muted); margin: 0 0 16px; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>登录 lovia</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% if bye %}<p class="note">已退出登录。</p>{% endif %}
    <input type="hidden" name="next" value="{{ next }}" />
    <label>用户名<input name="user_id" autocomplete="username" required autofocus /></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
    <button type="submit">登录</button>
  </form>
  {% if bye %}
  <script>
    // The chat UI keeps unsent drafts in localStorage, one origin for every
    // user: drop them on sign-out so the next person on this browser doesn't
    // see them. Preferences (theme, language) stay.
    try {
      for (const key of Object.keys(localStorage)) {
        if (key.startsWith('lovia-draft:') || key === 'lovia-followups' || key === 'lovia-runs-seen') {
          localStorage.removeItem(key);
        }
      }
    } catch (e) { /* storage blocked: nothing to clear */ }
  </script>
  {% endif %}
</body>
</html>
